<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-2: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #f59e0b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, var(--bg-2), var(--bg) 70%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .wrap {
    text-align: center;
    max-width: 480px;
  }

  .icon {
    font-size: 56px;
    margin-bottom: 20px;
    display: inline-block;
    animation: wobble 2.4s ease-in-out infinite;
  }

  @keyframes wobble {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }

  h1 {
    font-size: clamp(24px, 5vw, 34px);
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }

  p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 28px;
  }

  .bar {
    height: 6px;
    width: 100%;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 40%;
    background: linear-gradient(90deg, var(--accent), #fbbf24);
    border-radius: 999px;
    animation: slide 1.8s ease-in-out infinite;
  }

  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  .meta {
    margin-top: 28px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="icon">🚧</div>
    <h1>Diese Seite wird gerade gebaut</h1>
    <p>Schau bald wieder vorbei — bis dahin ist hier noch Baustelle.</p>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="meta">Under Construction</div>
  </div>

</body>
</html>
